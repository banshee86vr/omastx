server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json font/woff2;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API. The upstream name "backend" matches the compose service;
    # the Helm chart mounts its own config with the Kubernetes service name.
    location /api/ {
        proxy_pass http://backend:8484;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE scan progress streams (SPEC §2.4)
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /healthz {
        proxy_pass http://backend:8484;
    }
}
