name: omastx

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: omastx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omastx}
      POSTGRES_DB: omastx
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omastx -d omastx"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      OMASTX_DEV: "true"
      DATABASE_URL: postgres://omastx:${POSTGRES_PASSWORD:-omastx}@postgres:5432/omastx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_OMASTX_DEV: "true"
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
