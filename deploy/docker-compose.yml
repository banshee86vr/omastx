name: omastx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omastx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omastx}
      POSTGRES_DB: omastx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omastx -d omastx"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgres://omastx:${POSTGRES_PASSWORD:-omastx}@postgres:5432/omastx?sslmode=disable
      OMASTX_MASTER_KEY: ${OMASTX_MASTER_KEY:?set OMASTX_MASTER_KEY in deploy/.env (openssl rand -hex 32)}
      OMASTX_ADMIN_EMAIL: ${OMASTX_ADMIN_EMAIL:-admin@example.com}
      OMASTX_ADMIN_PASSWORD: ${OMASTX_ADMIN_PASSWORD:?set OMASTX_ADMIN_PASSWORD in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
